# MySQL 8.4 LTS for local development and the tests, the same version as
# production. Start it with `docker compose up -d --wait`; see
# docs/local-development.md. The credentials come from .env (DB_DATABASE,
# DB_USERNAME, DB_PASSWORD), with the same local defaults as .env.example.
services:
    mysql:
        image: mysql:8.4
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_DATABASE: ${DB_DATABASE:-kotak}
            MYSQL_USER: ${DB_USERNAME:-kotak}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            # Reachable from this machine only.
            - 127.0.0.1:${FORWARD_DB_PORT:-3306}:3306
        volumes:
            - mysql-data:/var/lib/mysql
            # Runs once, on a new volume: adds the kotak_testing database.
            - ./docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
        healthcheck:
            # A real login over TCP, so it only passes once the first-start
            # set-up is done, and fails if .env no longer matches the volume.
            test: [CMD-SHELL, 'mysql --host=127.0.0.1 --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD" --execute="SELECT 1" "$$MYSQL_DATABASE"']
            interval: 3s
            timeout: 5s
            retries: 10
            start_period: 60s

volumes:
    mysql-data:
