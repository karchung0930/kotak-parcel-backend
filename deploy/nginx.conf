# /etc/nginx/conf.d/kotak.conf (Amazon Linux 2023). See docs/deploy-aws-ec2.md.
# Certbot adds the HTTPS server block. default_server makes this site answer
# every request, so the stock server block in nginx.conf can stay.
server_names_hash_bucket_size 64;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kotak.example.com;
    root /var/www/kotak/kotak-parcel-backend/public;

    index index.php;
    charset utf-8;

    # Delivery photos are up to 5 MB.
    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite puts a content hash in every file name, so these never change.
    # The frontend build also writes a gzip copy (name.gz) of every file
    # over 1 KB, and gzip_static sends that copy to browsers that accept
    # gzip, so nothing here is compressed per request (the camera scanner's
    # WebAssembly runtime alone is 25 MB). gzip_proxied lets CloudFront,
    # whose requests carry a Via header, get the copies too; it does not
    # compress files over 10 MB itself. nginx's mime.types already serves
    # .wasm as application/wasm, which browsers need to compile it while it
    # downloads.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
        gzip_vary on;
        gzip_proxied any;
        try_files $uri =404;
    }

    # Live delivery progress: the browsers' WebSocket connections to Laravel
    # Reverb, which listens on 127.0.0.1:8080 only
    # (deploy/systemd/kotak-reverb.service). They arrive over the site's own
    # HTTPS, like every page. Only /app, the browsers' side, is passed on:
    # Laravel sends Reverb its messages on 127.0.0.1 directly.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Browsers send a ping every 30 seconds, so an open connection is
        # never idle this long.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        # The php-fpm upstream comes with the php8.4-fpm package
        # (/etc/nginx/conf.d/php-fpm.conf).
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Laravel sends a Link header listing every preloaded asset, which is
        # larger than nginx's default 4 KB buffer. Without these two lines
        # every page except /up returns 502 "upstream sent too big header".
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
